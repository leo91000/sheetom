[package]
name = "sheetom-native"
version = "0.1.0-rc.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
napi = { version = "=3.12.0", features = ["napi8"] }
napi-derive = "=3.6.2"

[build-dependencies]
napi-build = "=2.4.0"
