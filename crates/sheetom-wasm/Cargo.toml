[package]
name = "sheetom-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = { version = "=0.3.104", default-features = false, features = ["std"] }
serde_json = "=1.0.149"
sheetom-core = { path = "../sheetom-core" }
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std"] }

[build-dependencies]
serde_json = "=1.0.149"
