name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for release pull request validation
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.classify.outputs.browser }}
      docs: ${{ steps.classify.outputs.docs }}
      native: ${{ steps.classify.outputs.native }}
      package: ${{ steps.classify.outputs.package }}
      performance: ${{ steps.classify.outputs.performance }}
      quality: ${{ steps.classify.outputs.quality }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI and release scripts
        run: npm run ci:scripts:test
      - name: Classify changed paths
        id: classify
        run: node scripts/classify-ci-changes.mjs >> "$GITHUB_OUTPUT"
        env:
          SHEETOM_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          SHEETOM_CI_HEAD: ${{ github.sha }}
          SHEETOM_CI_FORCE_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

  changeset-policy:
    if: github.event_name == 'pull_request' || inputs.base_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require a Changeset or explicit classification
        run: npm run changeset:check
        env:
          SHEETOM_CHANGESET_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          SHEETOM_NO_CHANGESET: ${{ contains(github.event.pull_request.labels.*.name, 'no-changeset') && '1' || '0' }}

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-quality-v2-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-quality-v2-${{ runner.os }}-1.88-

      - name: Build the host native binding
        run: npm run native:build

      - name: Typecheck
        run: npm run typecheck

      - name: Test public behavior
        run: npm run test:unit

      - name: Run deterministic fuzz corpus
        run: npm run fuzz
        env:
          SHEETOM_FUZZ_RUNS: 1000

      - name: Validate conformance documents
        run: npm run conformance:validate

      - name: Check pinned WPT mapping drift
        run: npm run conformance:drift

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run docs:check

  native-quality:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-quality
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-native-quality-v2-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-native-quality-v2-${{ runner.os }}-1.88-
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:check
      - run: npm run native:test
      - name: Install the Chromium oracle
        run: npx playwright install chromium
      - name: Compare native declaration sequences with Chromium
        run: npm run native:browser-differential

  native-bindings:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.package == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-vs2026-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up the shared Rust compilation cache
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: ${{ matrix.target }}-release
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-target-v2-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Build the native target
        run: npm run native:build:target -- ${{ matrix.target }}
      - name: Load and exercise the native target
        run: node scripts/test-native-loader.mjs && node scripts/test-native-foundation.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  native-musl-bindings:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.package == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
          key: native-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}
      - name: Build the pinned musl toolchain image
        run: docker build --file .github/native-musl.Dockerfile --tag sheetom-musl-builder .github
      - name: Build and exercise the native target in musl
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --env CARGO_HOME=/cargo
          --env RUSTUP_HOME=/usr/local/rustup
          --volume "${HOME}/.cargo:/cargo"
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          sheetom-musl-builder
          sh -c "npm ci && node scripts/build-native-target.mjs ${{ matrix.target }} && node scripts/test-native-loader.mjs && node scripts/test-native-foundation.mjs"
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  native-fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-nightly-fuzz
      - id: cargo-fuzz-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Verify the fuzz target uses vendored Lightning CSS
        run: |
          lightning_manifest=$(cargo +nightly metadata --manifest-path fuzz/Cargo.toml --format-version 1 | jq -r '.packages[] | select(.name == "lightningcss") | .manifest_path')
          test "$lightning_manifest" = "$GITHUB_WORKSPACE/vendor/lightningcss/Cargo.toml"
      - name: Run the native fuzz smoke corpus
        run: |
          cp -R fuzz/corpus/declaration_block "$RUNNER_TEMP/sheetom-fuzz-corpus"
          cargo +nightly fuzz run declaration_block "$RUNNER_TEMP/sheetom-fuzz-corpus" -- -runs=10000 -max_len=1048577
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  browser-compatibility:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser adapters
        run: npm run test:browser:matrix

      - name: Reprobe reviewed shorthand grammar branches
        run: npm run generate:shorthand-grammar && npm run generate:native-grammar

      - name: Run browser differential and native reparsing evidence
        run: npm run native:build && npm run test:differential

  package-artifact:
    needs: [changes, native-bindings, native-musl-bindings]
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download native bindings
        uses: actions/download-artifact@v8
        with:
          pattern: sheetom-native-*
          path: native-artifacts

      - name: Collect the complete native binding set
        run: npm run native:collect -- native-artifacts

      - name: Build package artifact
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheetom-package
          path: package-artifact/*.tgz
          if-no-files-found: error

  minimum-node:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - name: Install with the npm bundled with Node 22
        run: npm ci
      - run: npm run native:build
      - run: npm run test:unit

  package-consumer:
    needs: package-artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: ubuntu-24.04-arm
            node: 22
          - os: windows-2025
            node: 22
          - os: windows-2025
            node: 24
          - os: windows-11-arm
            node: 22
          - os: macos-15
            node: 22
          - os: macos-15
            node: 24
          - os: macos-15-intel
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - name: Test with the npm bundled with the selected Node version
        run: node scripts/test-tarball.mjs package-artifact node

  musl-consumer:
    needs: package-artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - name: Test the tarball in Node Alpine
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          node:22-alpine
          node scripts/test-tarball.mjs package-artifact node

  bun-consumer:
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - run: node scripts/test-tarball.mjs package-artifact bun

  deno-consumer:
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - run: node scripts/test-tarball.mjs package-artifact deno

  node-current-signal:
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run test:unit

  performance:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.base_sha != '') && needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run build
      - run: node scripts/benchmark.mjs --output candidate-benchmark.json
      - name: Check out base commit as a detached worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: git worktree add --detach ../sheetom-baseline "$BASE_SHA"
      - run: npm ci
        working-directory: ../sheetom-baseline
      - run: npm run native:build
        working-directory: ../sheetom-baseline
      - run: npm run build
        working-directory: ../sheetom-baseline
      - name: Benchmark base commit with the candidate harness
        run: node scripts/benchmark.mjs --module "$GITHUB_WORKSPACE/../sheetom-baseline/dist/index.js" --output candidate-base-benchmark.json
      - run: node scripts/compare-benchmarks.mjs candidate-base-benchmark.json candidate-benchmark.json
