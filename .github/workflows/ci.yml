name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for release pull request validation
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.classify.outputs.browser }}
      docs: ${{ steps.classify.outputs.docs }}
      native: ${{ steps.classify.outputs.native }}
      package: ${{ steps.classify.outputs.package }}
      performance: ${{ steps.classify.outputs.performance }}
      quality: ${{ steps.classify.outputs.quality }}
      vendor: ${{ steps.classify.outputs.vendor }}
      wasm: ${{ steps.classify.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI and release scripts
        run: npm run ci:scripts:test
      - name: Classify changed paths
        id: classify
        run: node scripts/classify-ci-changes.ts >> "$GITHUB_OUTPUT"
        env:
          SHEETOM_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          SHEETOM_CI_HEAD: ${{ github.sha }}
          SHEETOM_CI_FORCE_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

  changeset-policy:
    if: github.event_name == 'pull_request' || inputs.base_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require a Changeset or explicit classification
        run: npm run changeset:check
        env:
          SHEETOM_CHANGESET_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          SHEETOM_NO_CHANGESET: ${{ (contains(github.event.pull_request.labels.*.name, 'no-changeset') || github.head_ref == 'changeset-release/main' || github.ref_name == 'changeset-release/main') && '1' || '0' }}

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-quality-v2-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-quality-v2-${{ runner.os }}-1.88-

      - name: Build the host native binding
        run: npm run native:build

      - name: Typecheck
        run: npm run typecheck

      - name: Test public behavior
        run: npm run test:unit

      - name: Build the public runtime
        run: npm run build

      - name: Gate Webref-derived Chromium property branches
        run: npm run native:webref-property-branches

      - name: Run deterministic fuzz corpus
        run: npm run fuzz
        env:
          SHEETOM_FUZZ_RUNS: 1000

      - name: Validate conformance documents
        run: npm run conformance:validate

      - name: Check pinned WPT mapping drift
        run: npm run conformance:drift

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run docs:check

  native-quality:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-quality
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-native-quality-v2-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-native-quality-v2-${{ runner.os }}-1.88-
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Check the SheetOM Rust workspace
        run: npm run native:core-check
      - name: Test vendored parser workspaces
        if: needs.changes.outputs.vendor == 'true'
        run: npm run native:vendor-check
      - run: npm run native:test
      - name: Gate Webref-derived Chromium property branches
        run: npm run native:webref-property-branches
      - name: Install the Chromium oracle
        run: npx playwright install chromium
      - name: Compare native declaration sequences with Chromium
        run: npm run native:browser-differential:run

  wasm-quality:
    needs: changes
    if: needs.changes.outputs.wasm == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WASM_BINDGEN_VERSION: 0.2.127
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: wasm32-release
      - uses: actions/cache@v6
        id: wasm-bindgen-cache
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}
      - name: Restore the pinned Playwright browser cohort
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-wasm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the pinned WebAssembly toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [[ "${{ steps.wasm-bindgen-cache.outputs.cache-hit }}" != "true" ]]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          fi
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run wasm:check
      - run: npm run wasm:build
      - run: npm run wasm:test
      - run: npm run wasm:test:memory -- --output "$RUNNER_TEMP/wasm-memory.json"
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Exercise direct HTTP and worker initialization
        run: npm run wasm:test:browsers -- --output "$RUNNER_TEMP/wasm-direct.json"
      - name: Exercise Vite, esbuild, Rollup, and Webpack consumers
        run: npm run wasm:test:bundlers -- --output "$RUNNER_TEMP/wasm-bundlers.json"
      - name: Gate the browser Publisher workload
        run: npm run wasm:test:performance -- --output "$RUNNER_TEMP/wasm-performance.json"
      - name: Compose WebAssembly backend evidence
        run: >-
          node scripts/compose-wasm-backend-evidence.ts
          --direct "$RUNNER_TEMP/wasm-direct.json"
          --bundlers "$RUNNER_TEMP/wasm-bundlers.json"
          --performance "$RUNNER_TEMP/wasm-performance.json"
          --memory "$RUNNER_TEMP/wasm-memory.json"
          --output "$RUNNER_TEMP/wasm-backend-evidence.json"
      - name: Pack the tested WebAssembly package
        run: |
          mkdir wasm-package
          npm pack --workspace @sheetom/wasm --pack-destination wasm-package
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-wasm-package
          path: wasm-package/*.tgz
          if-no-files-found: error
      - name: Upload WebAssembly backend evidence
        uses: actions/upload-artifact@v7
        with:
          name: wasm-backend-evidence
          path: ${{ runner.temp }}/wasm-backend-evidence.json
          if-no-files-found: error

  native-bindings:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.package == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          # Cross-compile on the faster x64 image; the package-consumer matrix
          # still loads these exact bytes on windows-11-arm.
          - target: aarch64-pc-windows-msvc
            os: windows-2025
            load_on_builder: false
          # Build with the x64 toolchain, then execute the packaged bytes with
          # x86 Node in the package-consumer matrix.
          - target: i686-pc-windows-msvc
            os: windows-2025
            load_on_builder: false
          # Apple Silicon cross-compiles the x64 binary faster; the packaged
          # bytes are still executed by the macos-15-intel consumer job.
          - target: x86_64-apple-darwin
            os: macos-15
            load_on_builder: false
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up the shared Rust compilation cache
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: ${{ matrix.target }}-release
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-target-v2-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Install the cross-compiled Rust target
        if: >-
          matrix.target == 'x86_64-apple-darwin' ||
          matrix.target == 'aarch64-pc-windows-msvc' ||
          matrix.target == 'i686-pc-windows-msvc'
        run: rustup target add ${{ matrix.target }}
      - name: Build the native target
        run: npm run native:build:target -- ${{ matrix.target }}
      - name: Load and exercise the native target
        if: matrix.load_on_builder != false
        run: node scripts/test-native-loader.ts && node scripts/test-native-foundation.ts
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  native-foreign-bindings:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
    env:
      CROSS_VERSION: 0.2.5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: cross-cache
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ env.CROSS_VERSION }}
      - name: Install the pinned cross compiler
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --version "$CROSS_VERSION" --locked
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
          key: native-cross-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Build the foreign native target
        run: npm run native:build:cross-target -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  native-musl-bindings:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.package == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
          key: native-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}
      - name: Build the pinned musl toolchain image
        run: docker build --file .github/native-musl.Dockerfile --tag sheetom-musl-builder .github
      - name: Build and exercise the native target in musl
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --env CARGO_HOME=/cargo
          --env RUSTUP_HOME=/usr/local/rustup
          --volume "${HOME}/.cargo:/cargo"
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          sheetom-musl-builder
          sh -c "npm ci && node scripts/build-native-target.ts ${{ matrix.target }} && node scripts/test-native-loader.ts && node scripts/test-native-foundation.ts"
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  native-fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-nightly-fuzz
      - id: cargo-fuzz-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Verify the fuzz targets use vendored CSS sources
        run: |
          lightning_manifest=$(cargo +nightly metadata --manifest-path fuzz/Cargo.toml --format-version 1 | jq -r '.packages[] | select(.name == "lightningcss") | .manifest_path')
          cssparser_manifest=$(cargo +nightly metadata --manifest-path fuzz/Cargo.toml --format-version 1 | jq -r '.packages[] | select(.name == "cssparser") | .manifest_path')
          test "$lightning_manifest" = "$GITHUB_WORKSPACE/vendor/lightningcss/Cargo.toml"
          test "$cssparser_manifest" = "$GITHUB_WORKSPACE/vendor/cssparser/Cargo.toml"
      - name: Run the native fuzz smoke corpus
        run: |
          cp -R fuzz/corpus/declaration_block "$RUNNER_TEMP/sheetom-fuzz-corpus"
          cargo +nightly fuzz run declaration_block "$RUNNER_TEMP/sheetom-fuzz-corpus" -- -runs=10000 -max_len=1048577
          cp -R fuzz/corpus/recovered_component_values "$RUNNER_TEMP/sheetom-recovered-value-corpus"
          cargo +nightly fuzz run recovered_component_values "$RUNNER_TEMP/sheetom-recovered-value-corpus" -- -runs=10000 -max_len=1048576
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  browser-compatibility:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser adapters
        run: npm run test:browser:matrix

      - name: Reprobe reviewed shorthand grammar branches
        run: npm run generate:shorthand-grammar && npm run generate:native-grammar && npm run generate:property-values && npm run generate:webref-property-branches

      - name: Run browser differential and native reparsing evidence
        run: npm run native:build && npm run test:differential

  package-artifact:
    needs: [changes, native-bindings, native-musl-bindings, native-foreign-bindings, wasm-quality]
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download native bindings
        uses: actions/download-artifact@v8
        with:
          pattern: sheetom-native-*
          path: native-artifacts

      - name: Collect the complete native binding set
        run: npm run native:collect -- native-artifacts

      - name: Download the tested WebAssembly package
        uses: actions/download-artifact@v8
        with:
          name: sheetom-wasm-package
          path: wasm-package

      - name: Build package artifact
        run: |
          mkdir package-artifact
          node scripts/pack-native-packages.ts package-artifact > package-artifact/native-packages.json
          cp wasm-package/*.tgz package-artifact/
          npm pack --pack-destination package-artifact
          npm run release:manifest -- package-artifact

      - name: Verify the first stable artifact promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "0.1.0" ]; then
            echo "The RC8-to-stable promotion gate does not apply to $version."
            exit 0
          fi
          mkdir reference-release
          gh release download v0.1.0-rc.8 --dir reference-release
          arguments=(
            "--reference=reference-release"
            "--candidate=package-artifact"
          )
          if [ -n "$PROMOTION_BASE_SHA" ]; then
            arguments+=("--base-sha=$PROMOTION_BASE_SHA")
          fi
          node scripts/verify-stable-promotion.ts "${arguments[@]}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheetom-package
          path: package-artifact
          if-no-files-found: error

  minimum-node:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - name: Install with the npm bundled with Node 22
        run: npm ci
      - run: npm run native:build
      - run: npm run test:unit

  package-consumer:
    needs: package-artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
            architecture: x64
          - os: ubuntu-24.04
            node: 24
            architecture: x64
          - os: ubuntu-24.04-arm
            node: 22
            architecture: arm64
          - os: windows-2025
            node: 22
            architecture: x64
          - os: windows-2025
            node: 24
            architecture: x64
          - os: windows-2025
            node: 22
            architecture: x86
          - os: windows-11-arm
            node: 22
            architecture: arm64
          - os: macos-15
            node: 22
            architecture: arm64
          - os: macos-15
            node: 24
            architecture: arm64
          - os: macos-15-intel
            node: 22
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - name: Test with the npm bundled with the selected Node version
        run: node scripts/test-tarball.ts package-artifact node

  foreign-package-consumer:
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm-gnueabihf
            platform: linux/arm/v7
            qemu: arm
            image: node:22.23.2-bookworm
          - target: linux-arm-musleabihf
            platform: linux/arm/v7
            qemu: arm
            image: node:22.23.2-alpine
          - target: linux-ppc64-gnu
            platform: linux/ppc64le
            qemu: ppc64le
            image: node:22.23.2-bookworm
          - target: linux-s390x-gnu
            platform: linux/s390x
            qemu: s390x
            image: sheetom-node-s390x
            custom_image: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu }}
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - name: Build the pinned glibc s390x Node runtime
        if: matrix.custom_image == true
        run: >-
          docker build
          --platform ${{ matrix.platform }}
          --file .github/native-s390x-consumer.Dockerfile
          --tag ${{ matrix.image }}
          .github
      - name: Load and exercise the exact foreign package
        run: >-
          docker run --rm
          --platform ${{ matrix.platform }}
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          ${{ matrix.image }}
          node scripts/test-tarball.ts package-artifact node

  musl-consumer:
    needs: package-artifact
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - name: Test the tarball in Node Alpine
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          node:22-alpine
          node scripts/test-tarball.ts package-artifact node

  bun-consumer:
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - run: node scripts/test-tarball.ts package-artifact bun

  deno-consumer:
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: package-artifact
      - run: node scripts/test-tarball.ts package-artifact deno

  node-current-signal:
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run test:unit

  performance-candidate:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.base_sha != '') && needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-performance-candidate
          path: |
            dist
            native
            packages/native-linux-x64-gnu
          if-no-files-found: error

  performance-baseline:
    needs: changes
    if: (github.event_name == 'pull_request' || inputs.base_sha != '') && needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: sheetom-performance-baseline
          path: |
            dist
            native
            packages/native-linux-x64-gnu
          if-no-files-found: error

  performance:
    needs: [changes, performance-candidate, performance-baseline]
    if: (github.event_name == 'pull_request' || inputs.base_sha != '') && needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-performance-candidate
          path: performance-candidate
      - uses: actions/download-artifact@v8
        with:
          name: sheetom-performance-baseline
          path: performance-baseline
      - name: Link split native packages into each benchmark runtime
        shell: bash
        run: |
          for runtime in performance-candidate performance-baseline; do
            package="$GITHUB_WORKSPACE/$runtime/packages/native-linux-x64-gnu"
            if [[ ! -d "$package" ]]; then
              continue
            fi
            modules="$GITHUB_WORKSPACE/$runtime/native/node_modules/@sheetom"
            mkdir -p "$modules"
            ln -s "$package" "$modules/native-linux-x64-gnu"
          done
      - name: Benchmark candidate with the candidate harness
        run: node scripts/benchmark.ts --module "$GITHUB_WORKSPACE/performance-candidate/dist/index.js" --output candidate-benchmark.json
      - name: Benchmark baseline with the candidate harness
        run: node scripts/benchmark.ts --module "$GITHUB_WORKSPACE/performance-baseline/dist/index.js" --output candidate-base-benchmark.json
      - run: node scripts/compare-benchmarks.ts candidate-base-benchmark.json candidate-benchmark.json
