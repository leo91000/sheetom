name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  changesets:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      pull-request: ${{ steps.changesets.outputs.pullRequestNumber }}
      head-ref: ${{ steps.release-pr.outputs.head_ref }}
      head-sha: ${{ steps.release-pr.outputs.head_sha }}
      version-changed: ${{ steps.release-version.outputs.version_changed }}
      ci-run-id: ${{ steps.ci-run.outputs.run_id }}

    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: node scripts/version-release.ts
          commit: "chore: version packages"
          title: "chore: release packages"
          commitMode: github-api
          createGithubReleases: false
          prDraft: create
          branch: main

      - name: Normalize the release pull request
        id: release-pr
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          gh pr edit "$RELEASE_PR" --body ""
          echo "head_ref=$(gh pr view "$RELEASE_PR" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(gh pr view "$RELEASE_PR" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Detect a versioned release commit
        id: release-version
        run: node scripts/detect-release-version-change.ts

      - name: Resolve the successful CI artifact run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$TRIGGERING_RUN_ID" ]; then
            run_id="$TRIGGERING_RUN_ID"
          else
            commit=$(git rev-parse HEAD)
            run_id=$(gh run list --workflow ci.yml --commit "$commit" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful CI run with a package artifact exists for this release commit" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  native-oracles:
    needs: changesets
    if: needs.changesets.outputs.pull-request != ''
    uses: ./.github/workflows/native-oracles.yml
    with:
      ref: ${{ needs.changesets.outputs.head-sha }}

  record-evidence:
    needs: [changesets, native-oracles]
    if: needs.changesets.outputs.pull-request != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      validation-head-sha: ${{ steps.release-validation.outputs.head_sha }}
      validation-run-id: ${{ steps.release-validation.outputs.run_id }}
      validation-run-url: ${{ steps.release-validation.outputs.run_url }}

    steps:
      - name: Check out the release pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changesets.outputs.head-ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set up the shared Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: linux-x64-release

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-release-evidence-v1-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-release-evidence-v1-${{ runner.os }}-1.88-

      - name: Build the reviewed host engine
        run: |
          npm run native:build
          npm run build

      - name: Install differential browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Download stable Chrome evidence
        uses: actions/download-artifact@v8
        with:
          name: wpt-chrome-stable
          path: reports/chrome

      - name: Download stable Firefox evidence
        uses: actions/download-artifact@v8
        with:
          name: wpt-firefox-stable
          path: reports/firefox

      - name: Download WebAssembly backend evidence
        uses: actions/download-artifact@v8
        with:
          name: wasm-backend-evidence
          path: reports/wasm

      - name: Record the release Compatibility Report
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/test-native-crash-safety.ts \
            --report="$RUNNER_TEMP/process-safety.json"
          node scripts/check-native-public-corpus.ts \
            --report="$RUNNER_TEMP/native-corpus.json"
          npm run native:numeric-contracts -- \
            --report="$RUNNER_TEMP/numeric-properties.json"
          npm run native:property-contracts -- \
            --report="$RUNNER_TEMP/property-values.json"
          npm run native:webref-property-branches -- \
            --report="$RUNNER_TEMP/webref-properties.json"
          node scripts/browser-geometric-differential.ts \
            --report="$RUNNER_TEMP/geometric.json"
          SHEETOM_RECORD_BASELINE=1 node scripts/record-operation-fixtures.ts \
            --output "$RUNNER_TEMP/operation-fixtures.json"
          SHEETOM_RECORD_BASELINE=1 npm run conformance:record -- \
            --output "$RUNNER_TEMP/$version.json" \
            --operation-report="$RUNNER_TEMP/operation-fixtures.json" \
            --native-corpus-report="$RUNNER_TEMP/native-corpus.json" \
            --numeric-property-report="$RUNNER_TEMP/numeric-properties.json" \
            --property-value-report="$RUNNER_TEMP/property-values.json" \
            --webref-property-report="$RUNNER_TEMP/webref-properties.json" \
            --process-safety-report="$RUNNER_TEMP/process-safety.json" \
            --geometric-report="$RUNNER_TEMP/geometric.json" \
            --wasm-backend-report=reports/wasm/wasm-backend-evidence.json \
            --wpt-report=chrome=reports/chrome/wpt-chrome.json \
            --wpt-report=firefox=reports/firefox/wpt-firefox.json
          cp "$RUNNER_TEMP/$version.json" "compatibility/baselines/$version.json"
          npm run conformance:validate

      - name: Commit immutable release evidence
        env:
          HEAD_REF: ${{ needs.changesets.outputs.head-ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compatibility/baselines
          if ! git diff --cached --quiet; then
            git commit -m "chore: update release evidence"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Start release pull request validation
        id: release-validation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.changesets.outputs.head-ref }}
          RELEASE_PR: ${{ needs.changesets.outputs.pull-request }}
        run: |
          gh pr edit "$RELEASE_PR" --body ""
          if [ "$(gh pr view "$RELEASE_PR" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$RELEASE_PR"
          fi
          base_sha=$(gh pr view "$RELEASE_PR" --json baseRefOid --jq .baseRefOid)
          head_sha=$(gh pr view "$RELEASE_PR" --json headRefOid --jq .headRefOid)
          gh run list \
            --workflow ci.yml \
            --branch "$HEAD_REF" \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId \
            > "$RUNNER_TEMP/release-validation-before.json"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=pending \
            -f context=sheetom/release-validation \
            -f description="Release validation is queued" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/ci.yml"
          gh workflow run ci.yml --ref "$HEAD_REF" -f "base_sha=$base_sha"

          run=''
          for attempt in $(seq 1 30); do
            gh run list \
              --workflow ci.yml \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,url \
              > "$RUNNER_TEMP/release-validation-after.json"
            run=$(jq -c \
              --arg head_sha "$head_sha" \
              --slurpfile before "$RUNNER_TEMP/release-validation-before.json" \
              '[.[] | select(
                .headSha == $head_sha and
                (.databaseId as $id | ($before[0] | map(.databaseId) | index($id) | not))
              )][0] // empty' \
              "$RUNNER_TEMP/release-validation-after.json")
            if [ -n "$run" ]; then break; fi
            sleep 2
          done
          if [ -z "$run" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
              -f state=error \
              -f context=sheetom/release-validation \
              -f description="Unable to resolve the release validation run" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/ci.yml"
            exit 1
          fi

          run_id=$(jq -r .databaseId <<<"$run")
          run_url=$(jq -r .url <<<"$run")
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=pending \
            -f context=sheetom/release-validation \
            -f description="Release validation is running" \
            -f target_url="$run_url"

  release-validation:
    needs: [changesets, record-evidence]
    if: >-
      always() &&
      needs.changesets.outputs.pull-request != '' &&
      needs.record-evidence.outputs.validation-head-sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      statuses: write

    steps:
      - name: Wait for the complete release pull request matrix
        id: validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.record-evidence.outputs.validation-run-id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Publish the release validation status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.record-evidence.outputs.validation-head-sha }}
          RUN_ID: ${{ needs.record-evidence.outputs.validation-run-id }}
          RUN_URL: ${{ needs.record-evidence.outputs.validation-run-url }}
          WAIT_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          conclusion=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          state=failure
          description="Release validation failed"
          if [ "$WAIT_OUTCOME" = success ] && [ "$conclusion" = success ]; then
            state=success
            description="Release validation passed"
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f "state=$state" \
            -f context=sheetom/release-validation \
            -f "description=$description" \
            -f "target_url=$RUN_URL"
          test "$state" = success

  publish:
    needs: changesets
    if: >-
      needs.changesets.outputs.has-changesets == 'false' &&
      needs.changesets.outputs.version-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Install dependencies
        run: npm ci

      - name: Download the tested multi-platform package
        uses: actions/download-artifact@v8
        with:
          name: sheetom-package
          path: ${{ runner.temp }}/sheetom-package
          github-token: ${{ github.token }}
          run-id: ${{ needs.changesets.outputs.ci-run-id }}

      - name: Verify release inputs
        run: npm run release:verify

      - name: Verify and publish the exact release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHEETOM_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SHEETOM_RELEASE_RUNTIMES: node,bun,deno
          SHEETOM_RELEASE_TARBALL: ${{ runner.temp }}/sheetom-package
        run: node scripts/publish-release.ts
