name: Install Playwright browser cohort
description: Install the pinned browser cohort with resilient Ubuntu package sources

runs:
  using: composite
  steps:
    - name: Prefer the public Ubuntu archive
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi

        printf '%s\n' \
          'Acquire::Retries "5";' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/80-sheetom-network >/dev/null

    - name: Install browser engines and system dependencies
      shell: bash
      run: npx playwright install --with-deps chromium firefox webkit
